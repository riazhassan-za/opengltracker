name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

# Read-only by default; the release job elevates only what it needs.
permissions:
  contents: read

# One Flutter version for every job, so test and release builds can't drift.
# Matches the version the project is developed against (Dart 3.12.2).
env:
  FLUTTER_VERSION: "3.44.4"

defaults:
  run:
    working-directory: app

jobs:
  # Keep action code immutable; the comments identify the tags these commits
  # were resolved from. Review and update the SHA when upgrading an action.
  test:
    runs-on: ubuntu-latest
    # Analyze + tests take a couple of minutes. Anything approaching this is a
    # hang.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        # --universal fetches the Material fonts that the layout tests render
        # with; a fresh runner only gets them during an app build otherwise.
        run: |
          flutter precache --universal --force
          ls "$FLUTTER_ROOT/bin/cache/artifacts/material_fonts" | head -5
          flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

  build-android:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # SHA-256 of the release signing certificate. Public, not a secret: it
      # lets anyone confirm a downloaded APK came from this project's key.
      RELEASE_CERT_SHA256: 19ca0f56accef8524158b6657afe356a508ebdf7e6eec19009a0fb57feb2b15c
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Refuse a tag that doesn't match the pubspec version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          pubspec="$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)"
          if [ "v$pubspec" != "$GITHUB_REF_NAME" ]; then
            echo "::error file=app/pubspec.yaml::Tag $GITHUB_REF_NAME does not \
          match pubspec version $pubspec. Bump the version before tagging."
            exit 1
          fi

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Restore the release signing key
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            # Fork PRs never see secrets. That's fine for a check build, but a
            # release signed with a throwaway debug key could never be
            # upgraded in place, so a tag must have the real key.
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              echo "::error::ANDROID_KEYSTORE_BASE64 is not set; refusing to \
          publish a release signed with a debug key."
              exit 1
            fi
            echo "No signing key available; building with the debug key."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"

      - name: Build APK
        run: flutter build apk --release

      - name: Name the artifact
        run: mv build/app/outputs/flutter-apk/app-release.apk OpenGLTracker-android.apk

      - name: Confirm the APK is signed with the release key
        # An APK quietly signed with the wrong key would install fine as a
        # fresh download but refuse to upgrade anyone, so check the
        # certificate rather than trust the build config.
        if: env.KEYSTORE_BASE64 != ''
        run: |
          set -euo pipefail
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          certs="$("$apksigner" verify --print-certs OpenGLTracker-android.apk)"
          echo "$certs"
          # The signer label varies by build-tools version ("Signer #1",
          # "V2 Signer:", ...), so match on the digest text only.
          found="$(echo "$certs" \
            | sed -n 's/^.*certificate SHA-256 digest: //p' | head -1)"
          echo "APK certificate SHA-256: $found"
          if [ "$found" != "$RELEASE_CERT_SHA256" ]; then
            echo "::error::APK is signed with $found, expected $RELEASE_CERT_SHA256"
            exit 1
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: OpenGLTracker-android
          path: app/OpenGLTracker-android.apk
          if-no-files-found: error

  build-web:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Build web app
        run: flutter build web --release

      - name: Package the web build
        run: |
          set -euo pipefail
          test -f build/web/index.html
          (cd build/web && zip -qr ../../OpenGLTracker-web.zip .)

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: OpenGLTracker-web
          path: app/OpenGLTracker-web.zip
          if-no-files-found: error

  release:
    # Separate from the builds so they can't race to create the release, and
    # so a tag publishes only once both platforms have succeeded.
    needs: [build-android, build-web]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    steps:
      # Needed for CHANGELOG.md; checks out the tag that triggered this run.
      # Full history so the tag can be proved to descend from main below.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Refuse to publish a tag that is not on main
        run: |
          set -euo pipefail
          git fetch --quiet origin main
          # A tag is enough to trigger this job, and the job holds
          # contents: write. Without this, anyone able to push a v* tag could
          # publish an official release built from a commit that never went
          # through a reviewed pull request. The tag ruleset in
          # .github/tag-protection.json is the primary control; this is the
          # check that does not depend on that ruleset staying configured.
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$GITHUB_REF_NAME points at a commit that is not \
          contained in main. Refusing to publish a release from it."
            exit 1
          fi
          echo "$GITHUB_REF_NAME is contained in main."

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish checksums alongside the downloads
        run: |
          cd artifacts
          sha256sum OpenGLTracker-* | tee SHA256SUMS.txt

      - name: Build the release notes from CHANGELOG.md
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"

          # Everything between this version's heading and whatever ends it:
          # the next version heading, or the link-reference block if this is
          # the oldest section in the file. index() rather than a dynamic
          # regex - the version's dots and the literal brackets both need
          # escaping there, and "[0.9.1]" quietly becomes a character class.
          awk -v v="$version" '
            index($0, "## [" v "]") == 1    { found = 1; next }
            found && index($0, "## [") == 1 { exit }
            found && /^\[.*\]: http/        { exit }
            found                           { print }
          ' CHANGELOG.md > section.md

          # A tag with no changelog section means the release would go out
          # describing nothing. Fail here rather than publish that: add the
          # section, delete the tag, and push it again. Checked before the
          # trim below, which would turn an empty file into a one-byte one.
          if [ ! -s section.md ]; then
            echo "::error file=CHANGELOG.md::No '## [$version]' section found. \
          Add one before tagging v$version."
            exit 1
          fi

          # Drop the blank lines the split leaves at either end.
          sed -e '/./,$!d' section.md | tac | sed -e '/./,$!d' | tac > notes.md

          cat >> notes.md <<'EOF'

          ---

          ### Download

          - **Android:** `OpenGLTracker-android.apk`. Allow installs from
            unknown sources, then open the file. It's sideloaded rather than
            from the Play Store, so Play Protect may ask you to confirm.
          - **Web:** `OpenGLTracker-web.zip` is a static site. Unzip it and
            serve the folder from any web server (opening `index.html`
            directly from disk won't work).

          Verify your download against `SHA256SUMS.txt`. The APK's signing
          certificate SHA-256 is
          `19:ca:0f:56:ac:ce:f8:52:41:58:b6:65:7a:fe:35:6a:50:8e:bd:f7:e6:ee:c1:90:09:a0:fb:57:fe:b2:b1:5c`.
          EOF

          echo "--- release notes ---"
          cat notes.md

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: |
            artifacts/OpenGLTracker-*
            artifacts/SHA256SUMS.txt
          body_path: notes.md
